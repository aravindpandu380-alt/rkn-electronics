
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RKN TV Sales & Service</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#172033}
header{background:#111827;color:white;padding:24px 16px;text-align:center}
header h1{margin:0 0 8px;font-size:25px}
header p{margin:0;color:#d1d5db}
main{max-width:650px;margin:24px auto;padding:0 14px}
.card{background:white;padding:20px;border-radius:14px;border:1px solid #e3e7ee;margin-bottom:18px}
h2{margin-top:0}
label{display:block;font-weight:600;margin:13px 0}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd2dc;border-radius:8px;margin-top:6px;font:inherit}
textarea{min-height:90px}
button,.callbtn{display:block;width:100%;padding:14px;background:#1559c5;color:white;border:0;border-radius:9px;font-size:16px;font-weight:bold;margin-top:10px;text-align:center;text-decoration:none}
.small{text-align:center;color:#596273;font-size:14px;margin-top:16px}
</style>
</head>
<body>
<header>
<h1>RKN TV Sales & Service</h1>
<p>TV Sales · TV Service & Repair</p>
</header>
<main>
<section class="card">
<h2>TV Sales</h2>
<p>కొత్త టీవీలు కొనుగోలు చేయడానికి మమ్మల్ని సంప్రదించండి.</p>
<a class="callbtn" href="tel:9100168283">Call for TV Sales</a>
</section>
<section class="card">
<h2>Book TV Repair Service</h2>
<form id="bookingForm">
<label>Your name<input name="name" required></label>
<label>Mobile number<input name="phone" type="tel" inputmode="tel" required></label>
<label>Service type
<select name="serviceType" required>
<option value="">Select service</option>
<option>TV Repair</option>
</select>
</label>
<label>TV Brand<input name="brand" placeholder="e.g. Samsung, LG"></label>
<label>TV Model (optional)<input name="model"></label>
<label>Problem<textarea name="issue" required placeholder="Briefly explain the TV problem"></textarea></label>
<label>Address<input name="address" required></label>
<label>Preferred date<input name="preferredDate" type="date"></label>
<button type="submit">Submit TV Booking</button>
<p id="message" class="small"></p>
</form>
</section>
<p class="small">Call: 9100168283 · Sarapaka</p>
</main>
<script>
document.getElementById("bookingForm").addEventListener("submit", async e => {
 e.preventDefault();
 const data = Object.fromEntries(new FormData(e.target).entries());
 const msg = document.getElementById("message");
 msg.textContent = "Submitting...";
 try {
  const r = await fetch("/api/bookings", {
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify(data)
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error || "Could not submit booking.");
  msg.textContent = "Booking received! Your booking number is RKN-" + d.bookingId + ". We will contact you.";
  e.target.reset();
 } catch(err) {
  msg.textContent = err.message + " Please try again or call 9100168283.";
 }
});
</script>
</body>
</html>
